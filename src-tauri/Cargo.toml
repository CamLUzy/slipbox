[package]
name = "slipbox"
version = "1.0.0"
description = "卡片盒 — a Luhmann-style slip box that keeps every card on your own computer"
authors = ["CamLUzy"]
license = "MIT"
repository = "https://github.com/CamLUzy/slipbox"
edition = "2021"
rust-version = "1.80"

[lib]
name = "slipbox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
ureq = { version = "3", default-features = false }
trash = "5"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

# Same versions as wry uses, to reach the WebView2 settings (browser shortcuts off).
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = "0.62"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
